<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HouseKeep AI{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #2d3748;
            line-height: 1.6;
        }
        nav {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        nav .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2b6cb0;
            text-decoration: none;
        }
        nav .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        nav .nav-links a {
            color: #4a5568;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
        }
        nav .nav-links a:hover,
        nav .nav-links a.active {
            color: #2b6cb0;
            border-bottom-color: #2b6cb0;
        }
        nav .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            color: #718096;
        }
        nav .user-info a {
            color: #718096;
            text-decoration: none;
        }
        nav .user-info a:hover { color: #e53e3e; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #2b6cb0;
            color: #fff;
        }
        .btn-primary:hover { background: #2c5282; }
        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger {
            background: #e53e3e;
            color: #fff;
        }
        .btn-danger:hover { background: #c53030; }
        h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: #1a202c; }
        h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.75rem; color: #2d3748; }
        h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: #4a5568; }
        input[type="text"], input[type="email"], textarea, select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-blue { background: #ebf8ff; color: #2b6cb0; }
        .badge-green { background: #f0fff4; color: #276749; }
        .badge-yellow { background: #fffff0; color: #975a16; }
        .badge-gray { background: #edf2f7; color: #4a5568; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }
        th { font-weight: 600; color: #4a5568; font-size: 0.85rem; text-transform: uppercase; }
        .text-muted { color: #a0aec0; }
        .text-sm { font-size: 0.85rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 1rem; }
        .flex { display: flex; }
        .gap-1 { gap: 0.5rem; }
        .gap-2 { gap: 1rem; }
        @media (max-width: 768px) {
            nav { padding: 0 1rem; }
            .container { padding: 1rem; }
            nav .nav-links { gap: 0.75rem; }
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if user %}
    <nav>
        <a href="/" class="logo">HouseKeep AI</a>
        <div class="nav-links">
            <a href="/chat">Chat</a>
            <a href="/documents">Documents</a>
            <a href="/maintenance">Maintenance</a>
            {% if user.role == 'admin' %}
            <a href="/admin">Admin</a>
            {% endif %}
        </div>
        <div class="user-info">
            <span>{{ user.name or user.email }}</span>
            <a href="/logout">Sign out</a>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
