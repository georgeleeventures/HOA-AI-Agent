{# Shared theme partial: tokens, base element styles, Inter font, theme toggle script. Include inside <head>. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function() {
  if (document.documentElement.dataset.theme) return;
  try {
    var saved = localStorage.getItem('theme');
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved || sys;
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
function toggleTheme() {
  var current = document.documentElement.dataset.theme || 'light';
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
}
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
      }
    });
  } catch (e) {}
}
</script>
<style>

  --fg: #fafafa;

  --fg-subtle: #71717a;
  --accent: #93c5fd;
  --accent-hover: #bfdbfe;
  --accent-fg: #0a0a0a;
  --accent-weak: #172554;
  --accent-weak-fg: #bfdbfe;
  --success: #4ade80;
  --success-weak: #14532d;
  --warn: #fbbf24;
  --warn-weak: #78350f;
  --danger: #f87171;
  --danger-weak: #7f1d1d;
  --ring: rgba(147, 197, 253, 0.28);

}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {

:where(a) { color: var(--accent); text-decoration: none; }
:where(a):hover { color: var(--accent-hover); }

.container {

  margin: 0 auto;
  padding: 2rem;
}

.btn {

  align-items: center;
  justify-content: center;

  height: 36px;
  padding: 0 14px;

  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  text-decoration: none;

}
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
.btn-primary {

  color: var(--accent-fg);

.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }
.btn-secondary {

.btn-danger {

  border-color: var(--danger);
}
.btn-danger:hover { filter: brightness(0.92); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

input[type="text"],
input[type="email"],
input[type="password"],
input[type="search"],
input[type="number"],
input[type="url"],
textarea,

textarea { height: auto; padding: 10px 12px; min-height: 80px; resize: vertical; line-height: 1.55; }

  border-color: var(--accent);

.badge {

  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-sm);

}
nav#mainNav :where(.nav-links a) {

nav#mainNav :where(.nav-links a):hover { color: var(--fg); }
nav#mainNav :where(.nav-links a.active) { color: var(--fg); }
nav#mainNav :where(.nav-links a.active)::after {
  content: "";

  left: 0;

  flex-shrink: 0;

nav#mainNav :where(.user-info a) { color: var(--fg-muted); text-decoration: none; }
nav#mainNav :where(.user-info a):hover { color: var(--danger); }

.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: transparent;

.hamburger:hover { background: var(--bg-sunken); color: var(--fg); }

.text-muted { color: var(--fg-muted); }
.text-subtle { color: var(--fg-subtle); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.mb-2 { margin-bottom: 1rem; }
.flex { display: flex; }
.gap-1 { gap: 0.5rem; }
.gap-2 { gap: 1rem; }

hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

::selection { background: var(--accent-weak); color: var(--accent-weak-fg); }

@media (max-width: 768px) {
  nav#mainNav { padding: 0 1rem; }
  .container { padding: 1rem; }
  .hamburger { display: inline-flex; }
  nav#mainNav .nav-links,
  nav#mainNav .user-info { display: none; }
  nav#mainNav.menu-open {
    flex-wrap: wrap;
    height: auto;
    padding-bottom: 0.75rem;
  }
  nav#mainNav.menu-open .nav-links,
  nav#mainNav.menu-open .user-info { display: flex; }
  nav#mainNav.menu-open .nav-links {
    order: 3;
    width: 100%;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--border);
    padding-top: 0.5rem;
    margin-top: 0.5rem;
    align-items: flex-start;
  }
  nav#mainNav.menu-open .nav-links a { padding: 0.6rem 0; }
  nav#mainNav.menu-open .nav-links a.active::after { display: none; }
  nav#mainNav.menu-open .user-info {
    order: 4;
    width: 100%;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
    margin-top: 0.25rem;
    justify-content: space-between;
  }
}
</style>
