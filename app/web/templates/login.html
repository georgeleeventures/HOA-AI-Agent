<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HouseKeep &mdash; Sign In</title>
    {% include "_theme.html" %}
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .auth-shell {
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .auth-toggle {
            position: absolute;
            top: -48px;
            right: 0;
        }
        .login-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .auth-logo-mark {
            width: 32px;
            height: 32px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .auth-logo-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--fg);
            letter-spacing: -0.01em;
        }
        .subtitle {
            color: var(--fg-muted);
            font-size: 14px;
            margin-bottom: 1.75rem;
            line-height: 1.55;
        }
        .error {
            background: var(--danger-weak);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 13px;
            text-align: left;
        }
        .btn-auth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            height: 44px;
            padding: 0 1rem;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            border: 1px solid transparent;
            margin-bottom: 0.6rem;
            font-family: inherit;
        }
        .btn-auth.primary {
            background: var(--accent);
            color: var(--accent-fg);
            border-color: var(--accent);
        }
        .btn-auth.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }
        .btn-auth.secondary {
            background: var(--bg-elev);
            color: var(--fg);
            border-color: var(--border);
        }
        .btn-auth.secondary:hover { border-color: var(--border-strong); background: var(--bg-sunken); color: var(--fg); }
        .auth-footer {
            margin-top: 1.5rem;
            color: var(--fg-subtle);
            font-size: 12px;
        }
        .auth-footer a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <button class="theme-toggle auth-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <div class="login-card">
            <div class="auth-logo">
                <div class="auth-logo-mark">H</div>
                <div class="auth-logo-text">HouseKeep</div>
            </div>
            <p class="subtitle">
                Your HOA's AI assistant. Ask questions about rules, policies,
                maintenance, finances, and more.
            </p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <a href="/auth/login" class="btn-auth primary">
                Continue with email
            </a>

            <a href="/login" class="btn-auth secondary">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Sign in with Google
            </a>

            <p class="auth-footer">
                No account? <a href="/signup">Create an HOA &rarr;</a>
            </p>
        </div>
    </div>
</body>
</html>
