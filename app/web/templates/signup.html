<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your HOA &mdash; HouseKeep</title>
    {% include "_theme.html" %}
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-shell {
            width: 100%;
            max-width: 460px;
            position: relative;
        }
        .auth-toggle { position: absolute; top: -48px; right: 0; }
        .card {
            background: var(--bg-elev);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .auth-logo-mark {
            width: 30px;
            height: 30px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }
        .auth-logo-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--fg);
            letter-spacing: -0.01em;
        }
        h1 {
            margin: 0.75rem 0 0.35rem;
            font-size: 22px;
            font-weight: 600;
            color: var(--fg);
            letter-spacing: -0.02em;
        }
        p.sub {
            margin: 0 0 1.5rem;
            color: var(--fg-muted);
            font-size: 13px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
            color: var(--fg-muted);
        }
        .card input { margin-bottom: 1rem; }
        .hint { font-size: 12px; color: var(--fg-subtle); margin: -0.75rem 0 1rem; }
        .card button {
            width: 100%;
            height: 42px;
            background: var(--accent);
            color: var(--accent-fg);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit;
        }
        .card button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .card button:disabled { background: var(--fg-subtle); border-color: var(--fg-subtle); cursor: not-allowed; }
        .message { padding: 0.6rem 0.85rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 13px; }
        .message.success { background: var(--success-weak); color: var(--success); border: 1px solid var(--border); }
        .message.error { background: var(--danger-weak); color: var(--danger); border: 1px solid var(--danger); }
        .link { color: var(--accent); text-decoration: none; font-size: 13px; }
        .link:hover { color: var(--accent-hover); }
        .footer { text-align: center; margin-top: 1rem; font-size: 12px; color: var(--fg-muted); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <button class="theme-toggle auth-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <div class="card">
            <div class="auth-logo">
                <div class="auth-logo-mark">H</div>
                <div class="auth-logo-text">HouseKeep</div>
            </div>
            <h1>Create your HOA</h1>
            <p class="sub">Set up your HOA on HouseKeep in under a minute.</p>

            <div id="message"></div>

            <div id="form">
                <label for="hoa_name">HOA name</label>
                <input type="text" id="hoa_name" placeholder="150 Twin Peaks HOA" oninput="autoSlug()">

                <label for="hoa_slug">URL slug</label>
                <input type="text" id="hoa_slug" placeholder="twin-peaks">
                <div class="hint">Lowercase letters, numbers, and hyphens only.</div>

                <label for="admin_email">Your email (admin)</label>
                <input type="email" id="admin_email" placeholder="you@example.com">

                <label for="admin_name">Your name</label>
                <input type="text" id="admin_name" placeholder="Optional">

                <button id="submit-btn" onclick="createHoa()">Create HOA</button>
            </div>

            <div class="footer">
                Already have an HOA? <a class="link" href="/auth/login">Sign in &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        function slugify(text) {
            return (text || "").toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 50);
        }

        let manualSlug = false;
        document.getElementById("hoa_slug").addEventListener("input", () => manualSlug = true);

        function autoSlug() {
            if (manualSlug) return;
            const name = document.getElementById("hoa_name").value;
            document.getElementById("hoa_slug").value = slugify(name);
        }

        async function createHoa() {
            const hoa_name = document.getElementById("hoa_name").value.trim();
            const hoa_slug = document.getElementById("hoa_slug").value.trim();
            const admin_email = document.getElementById("admin_email").value.trim();
            const admin_name = document.getElementById("admin_name").value.trim();

            if (!hoa_name || !admin_email) {
                showMessage("Please fill in HOA name and your email.", "error");
                return;
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "Creating...";

            try {
                const resp = await fetch("/signup", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({hoa_name, hoa_slug, admin_email, admin_name})
                });
                const data = await resp.json();
                if (resp.ok) {
                    document.getElementById("form").style.display = "none";
                    showMessage(
                        `${data.message} <br><br><a class="link" href="${data.next_step}">Continue to sign in &rarr;</a>`,
                        "success"
                    );
                } else {
                    showMessage(data.detail || "Something went wrong", "error");
                    btn.disabled = false;
                    btn.textContent = "Create HOA";
                }
            } catch (e) {
                showMessage("Network error. Try again.", "error");
                btn.disabled = false;
                btn.textContent = "Create HOA";
            }
        }

        function showMessage(text, type) {
            document.getElementById("message").innerHTML =
                text ? `<div class="message ${type}">${text}</div>` : "";
        }
    </script>
</body>
</html>
