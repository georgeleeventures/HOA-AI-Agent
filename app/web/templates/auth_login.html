<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &mdash; HouseKeep</title>
    {% include "_theme.html" %}
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-shell {
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .auth-toggle { position: absolute; top: -48px; right: 0; }
        .card {
            background: var(--bg-elev);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
        }
        .auth-logo-mark {
            width: 30px;
            height: 30px;
            background: var(--accent);
            color: var(--accent-fg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }
        .auth-logo-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--fg);
            letter-spacing: -0.01em;
        }
        p.sub {
            margin: 0 0 1.5rem;
            color: var(--fg-muted);
            font-size: 13px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
            color: var(--fg-muted);
        }
        .card input {
            margin-bottom: 0.9rem;
        }
        .card button {
            width: 100%;
            height: 42px;
            background: var(--accent);
            color: var(--accent-fg);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit;
        }
        .card button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .card button:disabled { background: var(--fg-subtle); border-color: var(--fg-subtle); cursor: not-allowed; }
        .divider {
            text-align: center;
            color: var(--fg-subtle);
            font-size: 12px;
            margin: 1.25rem 0 1rem;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .google-btn {
            background: var(--bg-elev) !important;
            color: var(--fg) !important;
            border: 1px solid var(--border) !important;
        }
        .google-btn:hover { background: var(--bg-sunken) !important; border-color: var(--border-strong) !important; }
        .message {
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 13px;
        }
        .message.success { background: var(--success-weak); color: var(--success); border: 1px solid var(--border); }
        .message.error { background: var(--danger-weak); color: var(--danger); border: 1px solid var(--danger); }
        .link { color: var(--accent); text-decoration: none; font-size: 13px; }
        .link:hover { color: var(--accent-hover); }
        .footer { text-align: center; margin-top: 1rem; font-size: 12px; color: var(--fg-muted); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <button class="theme-toggle auth-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle light/dark">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <div class="card">
            <div class="auth-logo">
                <div class="auth-logo-mark">H</div>
                <div class="auth-logo-text">HouseKeep</div>
            </div>
            <p class="sub">Sign in to your HOA dashboard</p>

            <div id="message"></div>

            <div id="step-email">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                <button id="send-btn" onclick="sendCode()">Send login code</button>
            </div>

            <div id="step-code" style="display:none">
                <label for="code">6-digit code</label>
                <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <button id="verify-btn" onclick="verifyCode()">Verify and sign in</button>
                <div class="footer" style="margin-top:0.75rem">
                    <a class="link" href="#" onclick="goBack();return false;">&larr; Use a different email</a>
                </div>
            </div>

            <div class="divider">or</div>
            <button class="google-btn" onclick="window.location='/login'">Continue with Google</button>

            <div class="footer">
                <a class="link" href="/signup">Don't have an account? Create an HOA &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "";

        async function sendCode() {
            const email = document.getElementById("email").value.trim();
            if (!email || !email.includes("@")) {
                showMessage("Please enter a valid email", "error");
                return;
            }
            const btn = document.getElementById("send-btn");
            btn.disabled = true;
            btn.textContent = "Sending...";
            try {
                const resp = await fetch("/auth/send-code", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({email})
                });
                if (resp.ok) {
                    currentEmail = email;
                    document.getElementById("step-email").style.display = "none";
                    document.getElementById("step-code").style.display = "block";
                    showMessage(`Check ${email} for a 6-digit code.`, "success");
                    setTimeout(() => document.getElementById("code").focus(), 100);
                } else {
                    const data = await resp.json().catch(() => ({}));
                    showMessage(data.detail || "Failed to send code", "error");
                    btn.disabled = false;
                    btn.textContent = "Send login code";
                }
            } catch (e) {
                showMessage("Network error. Try again.", "error");
                btn.disabled = false;
                btn.textContent = "Send login code";
            }
        }

        async function verifyCode() {
            const code = document.getElementById("code").value.trim();
            if (code.length !== 6) {
                showMessage("Please enter the 6-digit code", "error");
                return;
            }
            const btn = document.getElementById("verify-btn");
            btn.disabled = true;
            btn.textContent = "Verifying...";
            try {
                const resp = await fetch("/auth/verify-code", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({email: currentEmail, code})
                });
                if (resp.ok) {
                    const data = await resp.json();
                    window.location = data.redirect || "/";
                } else {
                    const data = await resp.json().catch(() => ({}));
                    showMessage(data.detail || "Invalid code", "error");
                    btn.disabled = false;
                    btn.textContent = "Verify and sign in";
                }
            } catch (e) {
                showMessage("Network error. Try again.", "error");
                btn.disabled = false;
                btn.textContent = "Verify and sign in";
            }
        }

        function goBack() {
            document.getElementById("step-code").style.display = "none";
            document.getElementById("step-email").style.display = "block";
            document.getElementById("send-btn").disabled = false;
            document.getElementById("send-btn").textContent = "Send login code";
            showMessage("", "");
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            if (!text) { el.innerHTML = ""; return; }
            el.innerHTML = `<div class="message ${type}">${text}</div>`;
        }
    </script>
</body>
</html>
